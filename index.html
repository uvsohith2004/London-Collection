<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Brand Title -->
    <title>London Collection — Modern Luxury Fashion</title>

    <!-- SEO -->
    <meta name="description" content="Discover modern luxury. Shop globally trusted fashion, handbags, watches, jewelry, and accessories at London Collection." />
    <meta name="author" content="London Collection" />

    <!-- Open Graph (Controls WhatsApp / LinkedIn Preview) -->
    <meta property="og:title" content="London Collection — Modern Luxury Fashion" />
    <meta property="og:description" content="Step into modern luxury. Trusted globally since 2009." />
    <meta property="og:type" content="website" />
    
    <!-- IMPORTANT: Replace later with your real domain image -->
    <meta property="og:image" content="/og-image.jpg" />

    <!-- Twitter Preview -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="London Collection — Modern Luxury Fashion" />
    <meta name="twitter:description" content="Trusted globally since 2009." />
    <meta name="twitter:image" content="/og-image.jpg" />

    <!-- Favicon (Add your logo inside /public) -->
    <link rel="icon" href="/favicon.ico" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
